name: Build, Test, and Package

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to package and upload
        required: true
        type: string
  push:
    branches:
      - "**"
  pull_request:
  release:
    types: [published]

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ (github.event_name == 'release' || github.event_name == 'workflow_dispatch') && github.run_id || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'release' && github.event_name != 'workflow_dispatch' }}

permissions:
  contents: read

env:
  BUILD_DIR: build

jobs:
  validate:
    name: Validate MSVC build and package
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'release' && github.event.release.tag_name || github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - name: Configure
        shell: pwsh
        run: >
          cmake -S . -B $env:BUILD_DIR
          -G "Visual Studio 17 2022"
          -A x64
          -DBUILD_EXAMPLES=ON
          -DBUILD_TESTS=ON
          -DBUILD_PACKAGE=ON

      - name: Build
        shell: pwsh
        run: cmake --build $env:BUILD_DIR --config Release --parallel

      - name: Test
        shell: pwsh
        run: ctest --test-dir $env:BUILD_DIR -C Release --output-on-failure

      - name: Package source code
        shell: pwsh
        run: cmake --build $env:BUILD_DIR --config Release --target wincpp_package

      - name: Validate package contents
        shell: pwsh
        run: |
          $archive = Join-Path $env:BUILD_DIR "wincpp-src.zip"

          if (-not (Test-Path -LiteralPath $archive))
          {
              throw "Expected package archive was not created: $archive"
          }

          $entries = tar -tf $archive | ForEach-Object { $_ -replace '\\', '/' }
          $requiredEntries = @(
              "CMakeLists.txt",
              "LICENSE",
              "README.md",
              "include/wincpp/wincpp.hpp",
              "include/wincpp/wincpp.inl",
              "include/wincpp/detail/win32.hpp"
          )

          foreach ($entry in $requiredEntries)
          {
              if ($entries -notcontains $entry)
              {
                  throw "Package archive is missing required entry: $entry"
              }
          }

          $forbiddenPrefixes = @(
              "examples/",
              "tests/"
          )

          foreach ($prefix in $forbiddenPrefixes)
          {
              $matches = $entries | Where-Object { $_.StartsWith($prefix, [System.StringComparison]::Ordinal) }

              if ($matches)
              {
                  throw "Package archive includes forbidden prefix '$prefix': $($matches[0])"
              }
          }

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: wincpp-src
          path: build/wincpp-src.zip
          if-no-files-found: error

  clang_cl:
    name: Validate clang-cl build
    runs-on: windows-latest
    env:
      BUILD_DIR: build-clang-cl

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'release' && github.event.release.tag_name || github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - name: Locate clang-cl and Visual Studio
        shell: pwsh
        run: |
          $clangCl = (Get-Command clang-cl -ErrorAction SilentlyContinue | Select-Object -First 1).Source

          if (-not $clangCl)
          {
              $candidate = "C:\Program Files\LLVM\bin\clang-cl.exe"

              if (Test-Path -LiteralPath $candidate)
              {
                  $clangCl = $candidate
              }
          }

          if (-not $clangCl)
          {
              throw "clang-cl was not found on the runner."
          }

          $vswhere = Join-Path ${env:ProgramFiles(x86)} "Microsoft Visual Studio\Installer\vswhere.exe"
          $visualStudioPath = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath

          if (-not $visualStudioPath)
          {
              throw "Visual Studio with MSVC tools was not found on the runner."
          }

          $vcvars64 = Join-Path $visualStudioPath "VC\Auxiliary\Build\vcvars64.bat"

          if (-not (Test-Path -LiteralPath $vcvars64))
          {
              throw "vcvars64.bat was not found: $vcvars64"
          }

          "CLANG_CL=$clangCl" >> $env:GITHUB_ENV
          "VCVARS64=$vcvars64" >> $env:GITHUB_ENV

          & $clangCl --version

      - name: Configure
        shell: pwsh
        run: >
          cmd /c
          "call `"$env:VCVARS64`" &&
          cmake -S . -B `"$env:BUILD_DIR`"
          -G Ninja
          -DCMAKE_CXX_COMPILER=`"$env:CLANG_CL`"
          -DCMAKE_BUILD_TYPE=Release
          -DBUILD_EXAMPLES=ON
          -DBUILD_TESTS=ON
          -DBUILD_PACKAGE=OFF"

      - name: Build
        shell: pwsh
        run: cmd /c "call `"$env:VCVARS64`" && cmake --build `"$env:BUILD_DIR`" --parallel"

      - name: Test
        shell: pwsh
        run: cmd /c "call `"$env:VCVARS64`" && ctest --test-dir `"$env:BUILD_DIR`" --output-on-failure"

  release:
    name: Upload release package
    if: github.event_name == 'release' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    needs: [validate, clang_cl]
    permissions:
      contents: write

    steps:
      - name: Download package artifact
        uses: actions/download-artifact@v4
        with:
          name: wincpp-src
          path: release

      - name: Add packaged source code to release
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: release/wincpp-src.zip
          tag: ${{ github.event_name == 'release' && github.event.release.tag_name || inputs.tag }}
          overwrite: true
